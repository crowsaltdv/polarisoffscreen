<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polaris</title>
<meta name="referrer" content="no-referrer">
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(vendor/inter/inter-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ink:#eaf6ff;--accent:#a8defc;--ac:168,222,252;--bg:7,15,32;--sd:4,9,19;--g1:16,35,74;--discord:88,101,242;--ease:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;background:radial-gradient(ellipse at 50% 35%,rgb(var(--g1)) 0%,rgb(var(--bg)) 60%,rgb(var(--sd)) 100%)}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* ---------- background image + rain ---------- */
#bgimg{display:none;position:fixed;inset:calc(var(--bgblur,0px)*-2);filter:blur(var(--bgblur,0px));z-index:0;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat;background-image:var(--bgimg,none);animation:fade 1.6s both}
#bgimg::after{content:"";position:absolute;inset:0;background:rgba(var(--sd),var(--bgdim,.4))}
html.hasbg #bgimg{display:block}
#rain{display:none;position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
html.hasbg.rainon #rain{display:block}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;transition:opacity 1s}
html.rainset #sky{opacity:0}

/* ---------- animations ---------- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-25deg)}60%{transform:scale(1.08) rotate(4deg)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;letter-spacing:.14em;filter:blur(14px)}to{opacity:1;letter-spacing:-.03em;filter:blur(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 18px rgba(var(--discord),.55)) drop-shadow(0 0 2px rgba(255,255,255,.25))}50%{filter:drop-shadow(0 0 44px rgba(var(--discord),.95)) drop-shadow(0 0 6px rgba(255,255,255,.4))}}
@keyframes ring{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

.orb{position:fixed;z-index:1;width:46vmax;height:46vmax;border-radius:50%;pointer-events:none;filter:blur(70px);opacity:.28;animation:drift 16s ease-in-out infinite}
.orb.a{left:-14vmax;top:-18vmax;background:rgb(var(--discord))}
.orb.b{right:-16vmax;bottom:-20vmax;background:rgb(var(--ac));animation-delay:-8s;animation-duration:20s}

/* ---------- content ---------- */
main{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3vh,28px);padding:24px;text-align:center}
.stage{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,28px);will-change:transform;transition:transform .25s ease-out}

.logo{position:relative;display:block;width:clamp(120px,22vw,220px);aspect-ratio:1;color:#fff;border-radius:50%;text-decoration:none;animation:pop 1.1s .1s var(--ease) both;transition:transform .45s var(--ease)}
.logo::before,.logo::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px solid rgba(var(--discord),.7);animation:ring 3s ease-out infinite;pointer-events:none}
.logo::after{animation-delay:1.5s}
.logo svg{position:relative;width:100%;height:100%;display:block;fill:currentColor;animation:float 6s ease-in-out infinite,glow 3.5s ease-in-out infinite}
.logo:hover{transform:scale(1.14) rotate(-4deg)}
.logo:active{transform:scale(.94)}

h1{margin:0;max-width:16ch;font-size:clamp(44px,9.5vw,112px);line-height:1.02;font-weight:800;letter-spacing:-.03em;background:linear-gradient(90deg,var(--ink) 40%,var(--accent) 50%,var(--ink) 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:reveal 1.3s .45s var(--ease) both,sheen 7s 2s linear infinite}
.sub{margin:0;font-size:clamp(18px,3vw,30px);font-weight:600;color:#fff;text-shadow:0 2px 18px rgba(var(--sd),.85),0 0 3px rgba(var(--sd),.6);animation:rise 1s .8s var(--ease) both}
h1{filter:drop-shadow(0 4px 24px rgba(var(--sd),.55))}

.join{display:inline-flex;align-items:center;gap:12px;margin-top:6px;padding:15px 30px;border-radius:999px;background:rgb(var(--discord));color:#fff;font-size:clamp(15px,2vw,19px);font-weight:700;text-decoration:none;box-shadow:0 10px 36px -8px rgba(var(--discord),.9),inset 0 1px 0 rgba(255,255,255,.25);animation:rise 1s 1.05s var(--ease) both;transition:transform .35s var(--ease),box-shadow .35s,background .25s}
.join svg{width:22px;height:22px;fill:currentColor}
.join .arr{display:inline-block;transition:transform .3s var(--ease)}
.join:hover{transform:translateY(-5px) scale(1.04);background:rgb(108,120,255);box-shadow:0 18px 48px -8px rgba(var(--discord),1),inset 0 1px 0 rgba(255,255,255,.3)}
.join:hover .arr{animation:nudge .8s ease-in-out infinite}
.join:active{transform:translateY(-1px) scale(.98)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="bgimg" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>

<main>
  <div class="stage" id="stage">
    <a class="logo" href="https://discord.gg/rg8MHRv4ps" target="_blank" rel="noopener noreferrer" aria-label="Join the Polaris Discord">
      <svg viewBox="0 0 24 24" role="img" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
    </a>
    <h1>This Polaris link is down.</h1>
    <p class="sub">Join the discord for working links.</p>
    <a class="join" href="https://discord.gg/rg8MHRv4ps" target="_blank" rel="noopener noreferrer">discord.gg/rg8MHRv4ps <span class="arr" aria-hidden="true">&rarr;</span></a>
  </div>
</main>

<script>
// ---------- background image (same default + saved choice as before) ----------
var BG={url:'https://images.pexels.com/photos/24604748/pexels-photo-24604748.jpeg?cs=srgb&dl=pexels-willianjusten-24604748.jpg&fm=jpg',dim:.03,blur:7,rain:true};
try{var _b=JSON.parse(localStorage.getItem('polaris-bg'));if(_b&&typeof _b.url==='string'&&(_b.url===''||/^(https?:\/\/|data:image\/)/i.test(_b.url))){BG={url:_b.url,dim:typeof _b.dim==='number'?Math.min(.85,Math.max(0,_b.dim)):.4,blur:typeof _b.blur==='number'?Math.min(30,Math.max(0,_b.blur)):0,rain:_b.rv===2&&_b.rain===true}}}catch(e){}
function cssUrl(u){return 'url("'+String(u).replace(/["\\\n\r]/g,function(c){return encodeURIComponent(c)})+'")'}
(function(){var st=document.documentElement.style,cl=document.documentElement.classList;
  if(BG.url){st.setProperty('--bgimg',cssUrl(BG.url));st.setProperty('--bgdim',BG.dim);st.setProperty('--bgblur',BG.blur+'px');cl.add('hasbg')}
  cl.toggle('rainset',!!(BG.url&&BG.rain))})();

// ---------- starfield (shows when there is no rain) ----------
var cv=document.getElementById('sky'),cx=cv.getContext('2d'),W,H,stars=[];
var reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
function size(){var D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
  stars=[];for(var i=0,n=Math.round(W*H/5500);i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:.2+Math.random()*.8,r:.4+Math.random()*1.3,t:Math.random()*6.28,s:.5+Math.random()*1.5,w:Math.random()<.15})}
size();addEventListener('resize',size);
var shoot=null;
function frame(t){
  cx.clearRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){var s=stars[i];
    var x=((s.x+(reduceMotion.matches?0:t*.004*s.z))%W+W)%W;
    var a=Math.min(1,(.35+.65*s.z)*(.55+.45*Math.sin(t*.001*s.s+s.t)));
    cx.fillStyle='rgba('+(s.w?'255,226,160':'234,246,255')+','+a+')';cx.beginPath();cx.arc(x,s.y,s.r*(.6+.4*s.z),0,6.283);cx.fill()}
  if(!reduceMotion.matches&&!shoot&&Math.random()<.003)shoot={x:Math.random()*W*.8,y:Math.random()*H*.4,l:0};
  if(shoot){shoot.x+=9;shoot.y+=4;shoot.l++;var g=cx.createLinearGradient(shoot.x,shoot.y,shoot.x-90,shoot.y-40);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-90,shoot.y-40);cx.stroke();if(shoot.l>110)shoot=null}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

// ---------- gentle parallax on the content ----------
var stage=document.getElementById('stage');
addEventListener('pointermove',function(e){if(reduceMotion.matches)return;
  stage.style.transform='translate('+Math.round(-(e.clientX/innerWidth-.5)*18)+'px,'+Math.round(-(e.clientY/innerHeight-.5)*14)+'px)'});

// ---------- raindrops (Codrops RainEffect, WebGL; see vendor/rain/README.txt) ----------
var rainFx=null,rainSig='',rainTm=0,rainBusy=false,rainFails=0;
function rainKey(){return BG.url+'|'+BG.blur+'|'+innerWidth+'x'+innerHeight}
function rainWanted(){return!!(BG.url&&BG.rain&&rainFails<3&&!document.hidden&&!reduceMotion.matches)}
function rainSync(){
  var root=document.documentElement;
  if(!rainWanted()){if(rainFx)rainFx.stop();root.classList.remove('rainon');return}
  if(rainFx&&rainFx.ready&&rainKey()===rainSig){rainFx.start();root.classList.add('rainon');return}
  clearTimeout(rainTm);rainTm=setTimeout(rainBuild,rainFx?200:0)}
async function rainBuild(){
  if(rainBusy||!rainWanted())return;
  rainBusy=true;var key=rainKey();
  try{
    var mod=await import('./vendor/rain/polaris-rain.js');
    if(!rainFx)rainFx=mod.createRainFx(document.getElementById('rain'));
    await rainFx.setScene(BG.url,BG.blur);rainSig=key;rainFails=0;
    if(rainWanted()){rainFx.start();document.documentElement.classList.add('rainon')}
  }catch(e){rainFails++;console.warn('Rain effect unavailable:',e);document.documentElement.classList.remove('rainon')}
  rainBusy=false;
  if(rainFx&&rainFx.ready&&rainWanted()&&rainKey()!==rainSig)rainSync()}
addEventListener('resize',function(){clearTimeout(rainTm);rainTm=setTimeout(rainSync,250)});
document.addEventListener('visibilitychange',rainSync);
if(reduceMotion.addEventListener)reduceMotion.addEventListener('change',rainSync);
setInterval(function(){if(!rainBusy&&rainWanted()&&!document.documentElement.classList.contains('rainon'))rainSync()},2500);
rainSync();
</script>
</body>
</html>
